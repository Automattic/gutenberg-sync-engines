<script type="module">
import * as Y from '/yjs/src/index.js'

const toBase64 = bytes => {
  let binary = ''
  for (const byte of bytes) {
    binary += String.fromCharCode(byte)
  }
  return btoa(binary)
}

const toHex = bytes => Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('')

const fromBase64 = base64 => Uint8Array.from(atob(base64), char => char.charCodeAt(0))

const browserDoc = new Y.Doc({ guid: 'm6-browser-doc' })
browserDoc.clientID = 601

const browserArray = browserDoc.getArray('array')
browserArray.insert(0, ['browser', 7, { nested: ['x', 'y'] }])

const browserMap = browserDoc.getMap('map')
browserMap.set('title', 'from browser')
const nestedMap = new Y.Map()
nestedMap.set('flag', true)
nestedMap.set('count', 2)
browserMap.set('nested', nestedMap)

const browserText = browserDoc.getText('text')
browserText.insert(0, 'Browser says hello')
browserText.format(8, 4, { strong: true, color: '#0a7' })

const browserXml = browserDoc.getXmlFragment('xml')
const section = new Y.XmlElement('section')
section.setAttribute('data-client', 'browser')
const xmlText = new Y.XmlText()
xmlText.insert(0, 'live')
section.insert(0, [xmlText])
browserXml.insert(0, [section])

const browserUpdate = Y.encodeStateAsUpdate(browserDoc)

let phpApplied = null
try {
  const response = await fetch('./php-generated-update.bin', { cache: 'no-store' })
  if (response.ok) {
    const bytes = new Uint8Array(await response.arrayBuffer())
    const phpDoc = new Y.Doc()
    Y.applyUpdate(phpDoc, bytes)
    phpApplied = {
      updateBase64: toBase64(bytes),
      updateHex: toHex(Y.encodeStateAsUpdate(phpDoc)),
      stateVectorHex: toHex(Y.encodeStateVector(phpDoc)),
      expected: {
        array: phpDoc.getArray('array').toJSON(),
        map: phpDoc.getMap('map').toJSON(),
        text: phpDoc.getText('text').toDelta(),
        xml: phpDoc.getXmlFragment('xml').toString()
      }
    }
  }
} catch (error) {
  phpApplied = { error: String(error && error.message ? error.message : error) }
}

window.m6Interop = {
  browserGenerated: {
    updateBase64: toBase64(browserUpdate),
    updateHex: toHex(browserUpdate),
    stateVectorHex: toHex(Y.encodeStateVector(browserDoc)),
    expected: {
      array: browserArray.toJSON(),
      map: browserMap.toJSON(),
      text: browserText.toDelta(),
      xml: browserXml.toString()
    }
  },
  phpApplied
}

document.getElementById('status').textContent = JSON.stringify(window.m6Interop, null, 2)
</script>
